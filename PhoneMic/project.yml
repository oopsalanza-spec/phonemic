name: PhoneMic

options:
  bundleIdPrefix: com.oopsalanza
  deploymentTarget:
    iOS: "16.0"

targets:
  PhoneMic:
    type: application
    platform: iOS

    sources:
      - path: Sources/PhoneMic
        excludes:
          - Info.plist

    info:
      path: Sources/PhoneMic/Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oopsalanza.phonemic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
