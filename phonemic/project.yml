name: Build PhoneMic IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Sources/PhoneMic/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify repository files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Checking project.yml:"
          test -f ./project.yml
          echo "project.yml FOUND"

          echo ""
          echo "Checking Sources/PhoneMic:"
          ls -la Sources/PhoneMic

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec ./project.yml

      - name: Verify Xcode project
        run: |
          test -d PhoneMic.xcodeproj
          echo "PhoneMic.xcodeproj FOUND"

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PhoneMic.xcodeproj \
            -scheme PhoneMic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify app
        run: |
          test -d build/Build/Products/Release-iphoneos/PhoneMic.app
          echo "PhoneMic.app FOUND"

      - name: Package IPA
        run: |
          rm -rf Payload PhoneMic.ipa
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/PhoneMic.app \
            Payload/PhoneMic.app

          zip -r PhoneMic.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-ipa
          path: PhoneMic.ipa
