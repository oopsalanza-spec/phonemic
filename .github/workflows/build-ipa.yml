name: Build PhoneMic IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "PhoneMic/Sources/PhoneMic/**"
      - "PhoneMic/project.yml"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify files
        run: |
          echo "Repository:"
          pwd

          echo ""
          echo "PhoneMic contents:"
          ls -la PhoneMic

          echo ""
          echo "Source files:"
          find PhoneMic/Sources/PhoneMic -maxdepth 2 -type f -print

          echo ""
          echo "Checking project.yml:"
          test -f PhoneMic/project.yml
          echo "project.yml FOUND"

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version

      - name: Generate Xcode project
        working-directory: PhoneMic
        run: |
          rm -rf PhoneMic.xcodeproj
          xcodegen generate --spec project.yml

      - name: Verify Xcode project
        working-directory: PhoneMic
        run: |
          test -d PhoneMic.xcodeproj
          echo "PhoneMic.xcodeproj FOUND"

      - name: List schemes
        working-directory: PhoneMic
        run: |
          xcodebuild \
            -project PhoneMic.xcodeproj \
            -list

      - name: Build unsigned app
        working-directory: PhoneMic
        run: |
          xcodebuild \
            -project PhoneMic.xcodeproj \
            -scheme PhoneMic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify app
        working-directory: PhoneMic
        run: |
          test -d build/Build/Products/Release-iphoneos/PhoneMic.app
          echo "PhoneMic.app FOUND"

      - name: Package IPA
        working-directory: PhoneMic
        run: |
          rm -rf Payload PhoneMic.ipa
          mkdir Payload

          cp -R \
            build/Build/Products/Release-iphoneos/PhoneMic.app \
            Payload/PhoneMic.app

          zip -r PhoneMic.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-ipa
          path: PhoneMic/PhoneMic.ipa
