name: Build PC Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "PhoneMic/pc/**"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r PhoneMic/pc/requirements.txt
          python -m pip install pyinstaller

      - name: Build receiver.exe
        shell: powershell
        run: |
          Set-Location PhoneMic/pc
          pyinstaller --onefile --noconsole --name receiver receiver.py
          New-Item -ItemType Directory -Force -Path build
          Copy-Item dist\receiver.exe build\receiver.exe -Force

      - name: Download VB-Cable driver
        shell: powershell
        run: |
          Set-Location PhoneMic/pc
          Invoke-WebRequest `
            -Uri "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip" `
            -OutFile "build\VBCABLE_Driver_Pack.zip"

          Expand-Archive `
            -Path "build\VBCABLE_Driver_Pack.zip" `
            -DestinationPath "build\vbcable" `
            -Force

          Copy-Item `
            "build\vbcable\VBCABLE_Setup_x64.exe" `
            "build\VBCABLE_Setup_x64.exe" `
            -Force

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Compile installer
        shell: powershell
        run: |
          Set-Location PhoneMic/pc
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-Setup
          path: PhoneMic/pc/dist_installer/PhoneMic-Setup.exe
